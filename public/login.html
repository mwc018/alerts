<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Storage Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Login · centered card on soft slate */
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0c1120;
        --surface: #161f30;
        --border: #2d3f56;
        --text: #f1f5f9;
        --text-muted: #8ca0bc;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0c1120;
      --surface: #161f30;
      --border: #2d3f56;
      --text: #f1f5f9;
      --text-muted: #8ca0bc;
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 60% at 5% 5%,  rgba(99,102,241,0.09) 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 95% 95%, rgba(16,185,129,0.06) 0%, transparent 55%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow:
        0 1px 3px rgb(0 0 0 / 0.07),
        0 8px 40px rgb(0 0 0 / 0.09);
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .icon-ring {
      width: 54px;
      height: 54px;
      background: linear-gradient(145deg, #4f46e5 0%, #7c3aed 100%);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
      box-shadow: 0 4px 16px rgba(79,70,229,0.28);
    }
    .icon-ring svg {
      width: 26px; height: 26px;
      stroke: #fff; stroke-width: 1.75;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text);
      margin-bottom: 7px;
    }

    .sub {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .ms-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px 18px;
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }
    .ms-btn:hover {
      border-color: #94a3b8;
      box-shadow: 0 2px 10px rgb(0 0 0 / 0.08);
    }
    .ms-logo { width: 20px; height: 20px; flex-shrink: 0; }

    .footer-note {
      margin-top: 26px;
      font-size: 11.5px;
      color: var(--text-muted);
      opacity: 0.65;
    }

    @media (max-width: 420px) {
      .card { padding: 36px 24px 28px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-ring">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
    </div>
    <h1>Storage Monitor</h1>
    <p class="sub">Sign in with your Turner Teleco Microsoft<br>account to access the dashboard.</p>
    <a href="/auth/start" class="ms-btn">
      <svg class="ms-logo" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Sign in with Microsoft
    </a>
    <p class="footer-note">Turner Teleco · Internal tool</p>
  </div>
</body>
</html>
