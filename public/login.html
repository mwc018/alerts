<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Storage Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 40px;
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .logo {
      font-size: 32px;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; font-weight: 600; color: #111827; margin-bottom: 8px; }
    p  { font-size: 14px; color: #6b7280; margin-bottom: 32px; line-height: 1.5; }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #2563eb;
      color: #fff;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s;
    }
    a.btn:hover { background: #1d4ed8; }
    .ms-icon {
      width: 18px; height: 18px;
      display: inline-block;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔒</div>
    <h1>Storage Monitor</h1>
    <p>Sign in with your Turner Teleco Microsoft account to continue.</p>
    <a href="/auth/start" class="btn">
      <svg class="ms-icon" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
        <rect x="1"  y="1"  width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1"  width="9" height="9" fill="#7fba00"/>
        <rect x="1"  y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Sign in with Microsoft
    </a>
  </div>
</body>
</html>
