<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Storage Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Storage Monitor dashboard · sticky header + card table */
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f8fafc;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;

      --text: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;

      --accent: #4f46e5;
      --accent-bg: #eef2ff;
      --accent-hover: #4338ca;
      --accent-fg: #ffffff;

      --green: #10b981;
      --green-bg: #d1fae5;
      --green-text: #065f46;

      --amber: #f59e0b;
      --amber-bg: #fef3c7;
      --amber-text: #92400e;

      --orange: #f97316;
      --orange-bg: #ffedd5;
      --orange-text: #9a3412;

      --red: #ef4444;
      --red-bg: #fee2e2;
      --red-text: #991b1b;

      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgb(0 0 0 / 0.07), 0 1px 2px -1px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 20px 40px rgb(0 0 0 / 0.12), 0 4px 8px rgb(0 0 0 / 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0c1120;
        --surface: #161f30;
        --surface-hover: #1d2942;
        --border: #2d3f56;
        --border-subtle: #1d2942;
        --text: #f1f5f9;
        --text-muted: #8ca0bc;
        --text-subtle: #4a607d;
        --accent: #6366f1;
        --accent-bg: #1e1b4b;
        --accent-hover: #818cf8;
        --green-bg: #052e1c;
        --green-text: #34d399;
        --amber-bg: #2c1a00;
        --amber-text: #fcd34d;
        --orange-bg: #2c1200;
        --orange-text: #fb923c;
        --red-bg: #2c0a0a;
        --red-text: #f87171;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0c1120;
      --surface: #161f30;
      --surface-hover: #1d2942;
      --border: #2d3f56;
      --border-subtle: #1d2942;
      --text: #f1f5f9;
      --text-muted: #8ca0bc;
      --text-subtle: #4a607d;
      --accent: #6366f1;
      --accent-bg: #1e1b4b;
      --accent-hover: #818cf8;
      --green-bg: #052e1c;
      --green-text: #34d399;
      --amber-bg: #2c1a00;
      --amber-text: #fcd34d;
      --orange-bg: #2c1200;
      --orange-text: #fb923c;
      --red-bg: #2c0a0a;
      --red-text: #f87171;
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 var(--border);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      max-width: 980px;
      margin: 0 auto;
      padding: 14px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px));
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(145deg, #4f46e5, #7c3aed);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(79,70,229,0.25);
    }
    .brand-icon svg {
      width: 18px; height: 18px;
      stroke: #fff; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .brand-text h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .brand-text p {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-sync {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn-sync:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-sync:disabled { opacity: 0.55; cursor: default; }
    .btn-signout {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn-signout:hover { color: var(--text); border-color: var(--text-muted); }

    /* ── Page body ── */
    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px max(20px, env(safe-area-inset-right, 0px)) 48px max(20px, env(safe-area-inset-left, 0px));
    }

    .toolbar {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
      min-height: 20px;
    }
    .sync-status {
      font-size: 12.5px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* ── Card + table ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      background: var(--surface);
      padding: 10px 20px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-subtle);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--surface-hover); }

    /* ── Site cell ── */
    .site-name {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.3;
    }
    .alert-chip {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.6;
    }
    .chip-red    { background: var(--red-bg);   color: var(--red-text); }
    .chip-amber  { background: var(--amber-bg); color: var(--amber-text); }

    /* ── Storage cell ── */
    .td-storage { min-width: 200px; }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bar-track {
      flex: 1;
      height: 7px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .fill-green  { background: linear-gradient(90deg, #34d399, #10b981); }
    .fill-amber  { background: linear-gradient(90deg, #fcd34d, #f59e0b); }
    .fill-orange { background: linear-gradient(90deg, #fdba74, #f97316); }
    .fill-red    { background: linear-gradient(90deg, #fca5a5, #ef4444); }

    .pct-label {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      min-width: 36px;
    }
    .pct-green  { color: var(--green); }
    .pct-amber  { color: var(--amber); }
    .pct-orange { color: var(--orange); }
    .pct-red    { color: var(--red); }

    .storage-detail {
      margin-top: 5px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .no-quota {
      font-size: 12px;
      color: var(--text-subtle);
      font-style: italic;
    }

    /* ── Threshold cell ── */
    .td-threshold { min-width: 130px; }
    .threshold-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .threshold-bdg {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .threshold-bdg::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .bdg-green { background: var(--green-bg); color: var(--green-text); }
    .bdg-amber { background: var(--amber-bg); color: var(--amber-text); }
    .bdg-red   { background: var(--red-bg);   color: var(--red-text); }

    .edit-btn {
      opacity: 0;
      transition: opacity 0.15s;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 9px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .edit-btn:hover { background: var(--surface-hover); color: var(--text); }
    tbody tr:hover .edit-btn { opacity: 1; }

    /* ── Empty / loading states ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 56px 24px;
      gap: 6px;
    }
    .empty-icon {
      width: 44px; height: 44px;
      color: var(--text-subtle);
      margin-bottom: 8px;
    }
    .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .empty-sub {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 280px;
      line-height: 1.6;
    }
    .btn-cta {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-cta:hover { background: var(--accent-hover); }

    .loading-cell {
      padding: 40px 20px !important;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    .error-cell {
      padding: 24px 20px !important;
      color: var(--red-text);
      background: var(--red-bg) !important;
      font-size: 13px;
    }

    /* ── Spinner ── */
    .spin {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      vertical-align: middle;
    }
    .spin-muted {
      border-color: var(--border);
      border-top-color: var(--accent);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 360px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 0;
    }
    .modal-header h2 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 2px 4px;
      line-height: 1;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
    }
    .modal-close:hover { color: var(--text); background: var(--surface-hover); }

    .modal-body {
      padding: 16px 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-site-name {
      font-weight: 600;
      font-size: 14px;
      padding: 10px 12px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
    }
    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .field input[type="number"] {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .field-hint {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-top: 6px;
    }
    .modal-err {
      background: var(--red-bg);
      color: var(--red-text);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 12.5px;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 20px 20px;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.55; cursor: default; }

    @media (max-width: 600px) {
      .brand-text p { display: none; }
      .header-inner { padding-inline: max(14px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-right, 0px)); }
      .page { padding-inline: max(14px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-right, 0px)); }
      thead th, tbody td { padding-inline: 14px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:16px;">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Storage Monitor</h1>
        <p>Acronis cloud storage · ttalx.com</p>
      </div>
    </div>
    <nav style="display:flex;align-items:center;gap:2px;">
      <a href="/admin" style="padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;text-decoration:none;color:var(--accent);background:var(--accent-bg);">Dashboard</a>
      <a href="/data" style="padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;text-decoration:none;color:var(--text-muted);transition:color 0.15s,background 0.15s;" onmouseover="this.style.color='var(--text)';this.style.background='var(--surface-hover)'" onmouseout="this.style.color='var(--text-muted)';this.style.background=''">Data Explorer</a>
    </nav>
    <div class="header-actions">
      <button class="btn-sync" id="sync-btn" onclick="syncNow()">
        Sync from Acronis
      </button>
      <a href="/auth/logout" class="btn-signout">Sign out</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="toolbar">
    <span class="sync-status" id="last-synced">Loading…</span>
  </div>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Client</th>
          <th>Current Storage</th>
          <th>Alert Threshold</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr>
          <td colspan="3" class="loading-cell">
            <span class="spin spin-muted"></span>&nbsp; Loading saved data…
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Edit threshold modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Alert Threshold</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="modal-error" class="modal-err" style="display:none"></div>
      <input type="hidden" id="edit-site-name" />
      <input type="hidden" id="edit-db-id" />
      <div class="modal-site-name" id="modal-site-label"></div>
      <div class="field">
        <label>Threshold (%)</label>
        <input id="f-threshold" type="number" min="1" max="100" value="80" />
        <p class="field-hint">A Zoho ticket is created when storage reaches this level. Set higher (e.g. 95) for clients where 80% alerts come too early.</p>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" id="modal-save" onclick="saveThreshold()">Save</button>
    </div>
  </div>
</div>

<script>
  let rows = [];

  function barClass(pct) {
    if (pct >= 100) return 'red';
    if (pct >= 90)  return 'orange';
    if (pct >= 80)  return 'amber';
    return 'green';
  }

  function thresholdBadge(t) {
    const cls = t >= 95 ? 'bdg-red' : t >= 80 ? 'bdg-amber' : 'bdg-green';
    return `<span class="threshold-bdg ${cls}">${t}%</span>`;
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render() {
    const tbody = document.getElementById('tbody');
    if (!rows.length) {
      tbody.innerHTML = `
        <tr><td colspan="3">
          <div class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
            <p class="empty-title">No storage data yet</p>
            <p class="empty-sub">Sync from Acronis to load client storage information.</p>
            <button class="btn-cta" onclick="syncNow()">Sync from Acronis</button>
          </div>
        </td></tr>
      `;
      return;
    }

    const sorted = [...rows].sort((a, b) => {
      const aNoQ = a.quotaFormatted === 'No quota set';
      const bNoQ = b.quotaFormatted === 'No quota set';
      if (aNoQ && !bNoQ) return 1;
      if (!aNoQ && bNoQ) return -1;
      if (a.alertType === 'StorageQuotaExceeded' && b.alertType !== 'StorageQuotaExceeded') return -1;
      if (b.alertType === 'StorageQuotaExceeded' && a.alertType !== 'StorageQuotaExceeded') return 1;
      return b.percentUsed - a.percentUsed;
    });

    tbody.innerHTML = sorted.map(r => {
      const noQuota = r.quotaFormatted === 'No quota set';
      const pct = Math.min(r.percentUsed, 100);
      const cls = barClass(r.percentUsed);
      const exceeded = r.alertType === 'StorageQuotaExceeded';
      const at80 = r.alertType === 'StorageQuotaAt80';

      const storageCell = noQuota
        ? (r.usedFormatted !== '—'
            ? `<div class="storage-detail" style="margin-top:0">${esc(r.usedFormatted)} used</div>
               <div class="no-quota">No quota set in Acronis</div>`
            : `<span class="no-quota">No data</span>`)
        : `<div class="bar-row">
             <div class="bar-track"><div class="bar-fill fill-${cls}" style="width:${pct}%"></div></div>
             <span class="pct-label pct-${cls}">${r.percentUsed}%</span>
           </div>
           <div class="storage-detail">${esc(r.usedFormatted)} of ${esc(r.quotaFormatted)}</div>`;

      const alertChip = noQuota ? '' : exceeded
        ? `<span class="alert-chip chip-red">Quota exceeded · Backups blocked</span>`
        : at80
        ? `<span class="alert-chip chip-amber">Storage alert active</span>`
        : '';

      return `
        <tr>
          <td>
            <div class="site-name">${esc(r.siteName)}</div>
            ${alertChip}
          </td>
          <td class="td-storage">${storageCell}</td>
          <td class="td-threshold">
            <div class="threshold-wrap">
              ${thresholdBadge(r.threshold)}
              <button class="edit-btn" onclick="openModal(${JSON.stringify(r).replace(/"/g,'&quot;')})">Edit</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function formatSyncTime(isoStr) {
    if (!isoStr) return null;
    try {
      return new Date(isoStr).toLocaleString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: 'numeric', minute: '2-digit', hour12: true,
      });
    } catch { return null; }
  }

  function updateSyncLabel(rowsData, fromDb) {
    const withQuota = rowsData.filter(x => x.quotaFormatted !== 'No quota set').length;
    const count = `${rowsData.length} client${rowsData.length !== 1 ? 's' : ''} · ${withQuota} with quota`;
    const ts = rowsData.reduce((best, r) => (!r.lastSyncedAt ? best : (!best || r.lastSyncedAt > best) ? r.lastSyncedAt : best), null);
    const timeLabel = ts ? formatSyncTime(ts) : null;
    const el = document.getElementById('last-synced');
    if (timeLabel) {
      el.textContent = `Synced ${timeLabel} · ${count}`;
    } else if (fromDb && rowsData.length === 0) {
      el.textContent = 'No data yet — click Sync from Acronis to load.';
    } else {
      el.textContent = count;
    }
  }

  async function loadFromDb() {
    try {
      const r = await fetch('/api/clients/storage-status');
      if (!r.ok) throw new Error(await r.text());
      rows = await r.json();
      if (rows.length === 0) {
        document.getElementById('tbody').innerHTML = `
          <tr><td colspan="3">
            <div class="empty-state">
              <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
              </svg>
              <p class="empty-title">No data yet</p>
              <p class="empty-sub">Sync from Acronis to load client storage information.</p>
              <button class="btn-cta" onclick="syncNow()">Sync from Acronis</button>
            </div>
          </td></tr>
        `;
        document.getElementById('last-synced').textContent = 'Not yet synced';
      } else {
        render();
        updateSyncLabel(rows, true);
      }
    } catch (e) {
      document.getElementById('tbody').innerHTML =
        `<tr><td colspan="3" class="error-cell">Failed to load saved data: ${esc(e.message)}</td></tr>`;
      document.getElementById('last-synced').textContent = '';
    }
  }

  async function syncNow() {
    const btn = document.getElementById('sync-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>&nbsp;Syncing…';
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="3" class="loading-cell"><span class="spin spin-muted"></span>&nbsp; Fetching from Acronis…</td></tr>';

    try {
      const r = await fetch('/api/clients/storage-status?refresh=true');
      if (!r.ok) throw new Error(await r.text());
      rows = await r.json();
      render();
      updateSyncLabel(rows, false);
    } catch (e) {
      document.getElementById('tbody').innerHTML =
        `<tr><td colspan="3" class="error-cell">Failed to load from Acronis: ${esc(e.message)}</td></tr>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sync from Acronis';
    }
  }

  function openModal(r) {
    document.getElementById('modal-error').style.display = 'none';
    document.getElementById('edit-site-name').value = r.siteName;
    document.getElementById('edit-db-id').value = r.clientDbId ?? '';
    document.getElementById('modal-site-label').textContent = r.siteName;
    document.getElementById('f-threshold').value = r.threshold;
    document.getElementById('overlay').classList.add('open');
    setTimeout(() => document.getElementById('f-threshold').select(), 50);
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
  }

  async function saveThreshold() {
    const errEl = document.getElementById('modal-error');
    errEl.style.display = 'none';

    const threshold = parseInt(document.getElementById('f-threshold').value, 10);
    if (isNaN(threshold) || threshold < 1 || threshold > 100) {
      errEl.textContent = 'Threshold must be between 1 and 100.';
      errEl.style.display = 'block';
      return;
    }

    const siteName = document.getElementById('edit-site-name').value;
    const dbId = document.getElementById('edit-db-id').value;
    const btn = document.getElementById('modal-save');
    btn.disabled = true;

    try {
      let r;
      if (dbId) {
        r = await fetch(`/api/clients/${dbId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ storage_threshold: threshold }),
        });
      } else {
        r = await fetch('/api/clients', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ site_name: siteName, storage_threshold: threshold }),
        });
      }
      if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'Save failed'); }

      const updated = await r.json();
      const row = rows.find(x => x.siteName === siteName);
      if (row) { row.threshold = updated.storage_threshold; row.clientDbId = updated.id; }
      render();
      closeModal();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('overlay')) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('overlay').classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && document.activeElement.id === 'f-threshold') saveThreshold();
  });

  document.addEventListener('DOMContentLoaded', loadFromDb);
</script>
</body>
</html>
